<div class="login-page">
  <form class="card login-card fade-up" #loginForm="ngForm" (ngSubmit)="submit()">

    <div class="login-card__brand">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
        <rect x="2" y="2" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.9"/>
        <rect x="15" y="2" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.4"/>
        <rect x="2" y="15" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.4"/>
        <rect x="15" y="15" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.9"/>
      </svg>
      <div>
        <h1 class="page__title" style="font-size:20px;margin-bottom:0">RAG GROQ</h1>
        <p class="page__subtitle">Entre com seu e-mail e senha</p>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">E-mail</label>
      <input
        id="email"
        class="form-input"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        email
        autocomplete="username"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Senha</label>
      <input
        id="password"
        class="form-input"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="current-password"
      />
    </div>

    @if (error()) {
      <div class="alert alert--error fade-up">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error() }}
      </div>
    }

    <div class="form-actions" style="justify-content:stretch">
      <button class="btn btn--primary" style="width:100%;justify-content:center" type="submit" [disabled]="loginForm.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span> Entrando…
        } @else {
          Entrar
        }
      </button>
    </div>

  </form>
</div>
