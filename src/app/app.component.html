<div class="app-shell">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.9"/>
          <rect x="15" y="2" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.4"/>
          <rect x="2" y="15" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.4"/>
          <rect x="15" y="15" width="11" height="11" rx="2" fill="var(--amber)" opacity="0.9"/>
        </svg>
      </div>
      <div>
        <span class="sidebar__name">RAG GROQ</span>
        <span class="sidebar__tagline">Document Intelligence</span>
      </div>
    </div>

    <nav class="sidebar__nav">
      <a routerLink="/ask" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Perguntar</span>
      </a>
      <a routerLink="/documents" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span>Documentos</span>
      </a>
      <a routerLink="/search" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Busca Semântica</span>
      </a>
    </nav>

    <div class="sidebar__status">
      <div class="status-dot" [class.status-dot--online]="apiOnline()" [class.status-dot--offline]="!apiOnline()"></div>
      <div class="status-info">
        <span class="status-label">API {{ apiOnline() ? 'Online' : 'Offline' }}</span>
        @if (health()) {
          <span class="status-model mono">{{ health()!.groq_model }}</span>
        }
      </div>
      @if (health()) {
        <span class="badge badge--amber">{{ health()!.collection_chunks }} chunks</span>
      }
    </div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main class="main-content">
    <router-outlet />
  </main>

</div>
